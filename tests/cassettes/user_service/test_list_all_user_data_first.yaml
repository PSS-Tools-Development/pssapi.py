        MissionDesignId=\"53\" PercentWeight=\"30\" StartDescription=\"A smile cracks
        your face; this will make a fine offering for your return home.\" EndDescription=\"This
        ship is... not what you were expecting. The strange crystalline structures
        throb and distort, defying your attempts to harvest them.|In mounting discomfort
        you hurriedly raid the ship's holds, keen to put the strange object behind
