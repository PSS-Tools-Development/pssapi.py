        MissionDesignId=\"10\" PercentWeight=\"100\" StartDescription=\"The start
        of your new life nearly becomes the end, as a marauder tries to take advantage
        of your inexperience. Use your new-found skills to see them off!\" EndDescription=\"You
        can find more captains to battle for rewards by selecting the PVP button on
        the galaxy map.\" TimeLimit=\"181\" MissionEventType=\"Battle\" EventXmlString=\"\"
        Title=\"\" IsSinglePlay=\"true\" RewardString=\"mineral:600|gas:300\" RequirementString=\"\"
