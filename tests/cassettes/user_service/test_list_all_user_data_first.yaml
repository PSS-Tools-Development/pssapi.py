        ParentMissionEventId=\"0\" BackgroundId=\"0\" ShipId=\"445\" BackgroundSpriteId=\"0\"
        /><MissionEvent MissionEventId=\"516\" MissionDesignId=\"20\" PercentWeight=\"50\"
        StartDescription=\"[3009]Prof. Brenda: Don't worry, you won't have to give
        up your pilot's licence. After all, trying to ground several billion academy
        graduates would probably start a civil war.|[3009]Prof. Brenda: Instead, we're
        offering a quick and easy crash course, to familiarize you with all the stuff
        the academy should have taught you but probably didn't.|[3009]Prof. Brenda:
        Best of all, we won't charge you a single starcent! You can contact me through
        your mission interface whenever you're ready to begin.\" EndDescription=\"\"
        TimeLimit=\"0\" MissionEventType=\"Story\" EventXmlString=\"\" Title=\"That's
        terrible!\" IsSinglePlay=\"true\" RewardString=\"\" RequirementString=\"\"
        CostString=\"\" FunctionString=\"marker(starSystemId=5,markerType=MissionObjective,markerFlags=6,missionDesignId=21,spriteId=12838)\"
        RequirementDescription=\"\" Flags=\"0\" ParentMissionEventId=\"32\" BackgroundId=\"0\"
        ShipId=\"0\" BackgroundSpriteId=\"0\" /><MissionEvent MissionEventId=\"32\"
        MissionDesignId=\"20\" PercentWeight=\"100\" StartDescription=\"[3009]Prof.
        Brenda: A bit of bad news, I'm afraid: One of our teacher AIs blew a fuse,
        and has been giving straight As to every student for the past decade.|[3009]
        Prof. Brenda: Long story short, your current diploma of graduation is now
        very slightly less than worthless.\" EndDescription=\"\" TimeLimit=\"180\"
        MissionEventType=\"Story\" EventXmlString=\"\" Title=\"\" IsSinglePlay=\"true\"
        RewardString=\"\" RequirementString=\"\" CostString=\"\" FunctionString=\"\"
        RequirementDescription=\"\" Flags=\"0\" ParentMissionEventId=\"0\" BackgroundId=\"0\"
        ShipId=\"0\" BackgroundSpriteId=\"0\" /><MissionEvent MissionEventId=\"33\"
        MissionDesignId=\"21\" PercentWeight=\"100\" StartDescription=\"[3009]Prof.
        Brenda: The Federation is a collection of star systems claimed by the united
        governments of Earth, and policed by the powerful Federation navy.|[3009]Prof.
        Brenda: The Federation do a pretty good job of guarding their borders, but
        their constant expansion tends to make them unpopular with other species.|[3009]Prof.
        Brenda: As you'd expect, a lot of folks get pretty upset when the Federation
        decides to colonize a world they already live on.|[3009]Prof. Brenda: The
        Federation is run by the admiralty board, experts in combat and logistics.
        Unfortunately they seldom agree on things, and Federation captains often come
        to blows over conflicting orders.|[3009]Prof. Brenda: Now, let's examine the
        combat efficiency of the average federation enforcer. First hand.\" EndDescription=\"[3009]Prof.
        Brenda: Well done captain, I'm giving you a pass for this lesson. See you
        next time!\" TimeLimit=\"180\" MissionEventType=\"Battle\" EventXmlString=\"\"
        Title=\"\" IsSinglePlay=\"true\" RewardString=\"mineral:1500|gas:700\" RequirementString=\"\"
        CostString=\"\" FunctionString=\"marker(starSystemId=5,markerType=MissionObjective,markerFlags=6,missionDesignId=22,spriteId=12838)\"
        RequirementDescription=\"\" Flags=\"0\" ParentMissionEventId=\"0\" BackgroundId=\"0\"
        ShipId=\"126\" BackgroundSpriteId=\"0\" /><MissionEvent MissionEventId=\"34\"
        MissionDesignId=\"22\" PercentWeight=\"100\" StartDescription=\"[3009]Prof.
        Brenda: Viewed as a whole, the pirates represent the strongest military force
        in the galaxy, with an unrivaled amount of ships and natural resources.|[3009]Prof.
        Brenda: Fortunately for everyone, they're far from unified. More than 100
        distinct nations exist in pirate space, constantly squabbling for power and
        prestige.|[3009]Prof. Brenda: Although regarded as crude, the pirates show
        strength and bravery in the face of adversity, and in fact insulate Federation
        space against much of the alien threats it may otherwise face.|[3009]Prof.
        Brenda: Fascinating stuff, no? Now, let's get a good look at that famous bravery.
        Good luck!\" EndDescription=\"[3009]Prof. Brenda: Those third gen fusion drives
        sure do make a big boom, huh? Great work today, captain!\" TimeLimit=\"180\"
        MissionEventType=\"Battle\" EventXmlString=\"\" Title=\"\" IsSinglePlay=\"true\"
        RewardString=\"mineral:2000|gas:1000\" RequirementString=\"\" CostString=\"\"
        FunctionString=\"marker(starSystemId=5,markerType=MissionObjective,markerFlags=6,missionDesignId=23,spriteId=12838)\"
        RequirementDescription=\"\" Flags=\"0\" ParentMissionEventId=\"0\" BackgroundId=\"0\"
        ShipId=\"127\" BackgroundSpriteId=\"0\" /><MissionEvent MissionEventId=\"35\"
        MissionDesignId=\"23\" PercentWeight=\"100\" StartDescription=\"[3009]Prof.
        Brenda: I'm gonna be straight with you, captain. We honestly don't know much
        at all about them. And neither, it seems, do they.|[3009]Prof. Brenda: Like
        most of the major races, Qtarians possess a basically human physiology and
        psychology. Unfortunately, a compulsive drive to recycle means they have neither
        history books or fossil records.|[3009]Prof. Brenda: A series of ruins spread
        across the galaxy indicate that Qtarians have possessed FTL technology for
        almost half a million years. What became of this expansive empire can only
        be guessed at.|[3009]Prof. Brenda: A network of ancient machines-- too exotic
        for modern science to comprehend-- grants every Qtarian a psychic link to
        others of their race. Human scientists have likened it to a colony of ants,
        although never where Qtarians might hear them.|[3009]Prof. Brenda: Their ships
        and weapons are often a patchwork of repurposed odds and ends, but nonetheless
        show the ingenuity of design their race is famous for. Let's check it out!\"
        EndDescription=\"[3009]Prof. Brenda: You're flying through these lessons,
        captain. I wish all my students were this receptive.\" TimeLimit=\"180\" MissionEventType=\"Battle\"
        EventXmlString=\"\" Title=\"\" IsSinglePlay=\"true\" RewardString=\"item:154x1|mineral:2000|gas:1000\"
        RequirementString=\"\" CostString=\"\" FunctionString=\"marker(starSystemId=5,markerType=MissionObjective,markerFlags=6,missionDesignId=24,spriteId=12838)\"
        RequirementDescription=\"\" Flags=\"0\" ParentMissionEventId=\"0\" BackgroundId=\"0\"
        ShipId=\"128\" BackgroundSpriteId=\"0\" /><MissionEvent MissionEventId=\"36\"
        MissionDesignId=\"24\" PercentWeight=\"100\" StartDescription=\"[3009]Prof.
        Brenda: These associations are not undeserved, but they don't show the whole
        picture. The first thing one should know is that the Visiri are probably not
        natural in origin.|[3009]Prof. Brenda: What we refer to as Visiri actually
        encompasses several related but distinct species, bound in tight symbiosis.
        While every species has some relationships like that, the degree of specialization
        in the Visiri has raised eyebrows.|[3009]Prof. Brenda: Now, we don't know
        who made them, or when, but it seems obvious they're born warriors, perhaps
        built for some long-forgotten conflict.|[3009]Prof. Brenda: I don't know about
        you, but that makes me want to cut them some slack. After all, what could
        be a sadder fate than to outlive one's purpose?|[3009]Prof. Brenda: Ah, enough
        explaining. Some things are better in demonstration.\" EndDescription=\"[3009]Prof.
        Brenda: Well done captain. I'm not sure how much more I've got to teach you.\"
        TimeLimit=\"180\" MissionEventType=\"Battle\" EventXmlString=\"\" Title=\"\"
        IsSinglePlay=\"true\" RewardString=\"mineral:3000|gas:1500\" RequirementString=\"\"
        CostString=\"\" FunctionString=\"marker(starSystemId=5,markerType=MissionObjective,markerFlags=6,missionDesignId=25,spriteId=12838)\"
        RequirementDescription=\"\" Flags=\"0\" ParentMissionEventId=\"0\" BackgroundId=\"0\"
        ShipId=\"124\" BackgroundSpriteId=\"0\" /><MissionEvent MissionEventId=\"37\"
        MissionDesignId=\"25\" PercentWeight=\"100\" StartDescription=\"[3009]Prof.
        Brenda: Earth's oldest surviving records, as far back as the first lunar landings,
        show reports of Gray ship sightings. Unfortunately, the first extraterrestrial
        species known to humanity is also arguably the worst.|[3009]Prof. Brenda:
        Although the Grays are unquestionably intelligent, they show none of the drive
        to communicate and understand that makes cross-cultural diplomacy possible.|[3009]Prof.
        Brenda: To our knowledge, no race has ever had a meaningful interaction with
        the Grays, beyond violence or abduction. To this day, we don't know if they're
        even capable of speech.[3009]Prof. Brenda: In spite of their universal hostility
        to other life, their ship designs show a great attention to detail, and even
        what other races might classify as passion. Observe!\" EndDescription=\"[3009]Prof.
        Brenda: Ah, what I'd give to know what was going on in their heads. Anyway,
        good job, captain. You pass once more!\" TimeLimit=\"180\" MissionEventType=\"Battle\"
        EventXmlString=\"\" Title=\"\" IsSinglePlay=\"true\" RewardString=\"mineral:3500|gas:2000\"
        RequirementString=\"\" CostString=\"\" FunctionString=\"marker(starSystemId=5,markerType=MissionObjective,markerFlags=6,missionDesignId=26,spriteId=12838)\"
        RequirementDescription=\"\" Flags=\"0\" ParentMissionEventId=\"0\" BackgroundId=\"0\"
        ShipId=\"51\" BackgroundSpriteId=\"0\" /><MissionEvent MissionEventId=\"38\"
        MissionDesignId=\"26\" PercentWeight=\"100\" StartDescription=\"[3009]Prof.
        Brenda: Of course, there's way too many to cover in a month, let alone six
        text boxes, but I'll try to touch on the more common specimens.|[3009]Prof.
        Brenda: One that you've probably already come across would be the robots.
        We're not sure why, but it seems like every time anyone makes a mechanical
        race, they try to wipe out all organic life. At this point it's more or less
        just a seasonal hazard, like mosquitoes.|[3009]Prof. Brenda: Beyond that,
        there's really no limit to what you'll find out there, from the  mighty Ardents
        to the insectile Roaches, the sessile Liffim to the now-extinct Draconians.|[3009]Prof.
        Brenda: There's the Oobranids, the Audemedian axis, the Children of the Torch,
        the Eaten Alliance, and of course the unpronounceable Dominion of Ggggg. That's
        just to name a few; we're finding more every day.|[3009]Prof. Brenda: No practical
        test today, captain, just prepare for the final exam. I'll see you then.\"
        EndDescription=\"\" TimeLimit=\"180\" MissionEventType=\"Story\" EventXmlString=\"\"
        Title=\"\" IsSinglePlay=\"true\" RewardString=\"mineral:5000|gas:3000\" RequirementString=\"\"
        CostString=\"\" FunctionString=\"marker(starSystemId=5,markerType=MissionObjective,markerFlags=6,missionDesignId=27,spriteId=12838)\"
        RequirementDescription=\"\" Flags=\"0\" ParentMissionEventId=\"0\" BackgroundId=\"0\"
        ShipId=\"0\" BackgroundSpriteId=\"0\" /><MissionEvent MissionEventId=\"39\"
        MissionDesignId=\"27\" PercentWeight=\"100\" StartDescription=\"[3009]Prof.
        Brenda: To celebrate the conclusion of our lessons, I have a gift for you.
        You know that final exam I told you about? It doesn't really exist.|[3009]Prof.
        Brenda: It gives me great personal pleasure to announce that you have passed
        my course with flying colours. Congratulations on earning your diploma, this
        time without the aid of a malfunctioning AI.|[3009]Prof. Brenda: Look, I can't
        really stay and chat. I've got a lot more students to take care of, but. Um.|[3009]Prof.
        Brenda: If you ever find yourself in the neighbourhood, I'd love to buy you
        a drink. Good luck, captain. And goodbye.\" EndDescription=\"\" TimeLimit=\"180\"
        MissionEventType=\"Story\" EventXmlString=\"\" Title=\"\" IsSinglePlay=\"true\"
        RewardString=\"item:353x1\" RequirementString=\"\" CostString=\"\" FunctionString=\"marker(starSystemId=5,markerType=MissionObjective,markerFlags=6,missionDesignId=211,spriteId=12838)\"
        RequirementDescription=\"\" Flags=\"0\" ParentMissionEventId=\"0\" BackgroundId=\"0\"
        ShipId=\"0\" BackgroundSpriteId=\"0\" /><MissionEvent MissionEventId=\"356\"
        MissionDesignId=\"81\" PercentWeight=\"20\" StartDescription=\"You back horse
        11! Why? Nobody knows.|As the race starts you notice your horse is farting
        with each gallop.|Incredibly the other horses are attracted to the smell and
        submit to your horse.|Your horse wins by default! Disgusting!\" EndDescription=\"You
        happily collect the prize from the bookie.\" TimeLimit=\"0\" MissionEventType=\"Story\"
        EventXmlString=\"\" Title=\"\" IsSinglePlay=\"true\" RewardString=\"item:222x1\"
        RequirementString=\"\" CostString=\"\" FunctionString=\"\" RequirementDescription=\"\"
        Flags=\"0\" ParentMissionEventId=\"301\" BackgroundId=\"0\" ShipId=\"0\" BackgroundSpriteId=\"0\"
        /><MissionEvent MissionEventId=\"1205\" MissionDesignId=\"211\" PercentWeight=\"50\"
        StartDescription=\"[12387]Prof. Brenda: Now that you've proven your basic
        proficiency as a star captain, I thought it was time for a follow-up lesson.|[12387]Prof.
        Brenda: A successful captain requires good ship AI; you can't be everywhere
        at once, so it's important that your ship and crew can work effectively without
        you.|[12387]Prof. Brenda: Good AI comes largely from trial and error, but
        AI chips can be a good starting place for any captains unfamiliar with programming
        ship AI.|[12387]Prof. Brenda: I've prepared a combat simulation for you, using
        the AI chips for the enemy ship. Be sure to pay careful attention to the crew's
        behaviours!\" EndDescription=\"[12387]Prof. Brenda: Note the defensive focus,
        and how well it can be augmented with some simple AI commands.|[12387]Prof.
        Brenda: Have a play around with that one, and come back when you're ready
        to see more!\" TimeLimit=\"180\" MissionEventType=\"Battle\" EventXmlString=\"\"
        Title=\"\" IsSinglePlay=\"true\" RewardString=\"item:751x1\" RequirementString=\"\"
        CostString=\"\" FunctionString=\"marker(starSystemId=5,markerType=MissionObjective,markerFlags=6,missionDesignId=215,spriteId=12838)\"
        RequirementDescription=\"\" Flags=\"0\" ParentMissionEventId=\"0\" BackgroundId=\"0\"
        ShipId=\"97\" BackgroundSpriteId=\"0\" /><MissionEvent MissionEventId=\"1234\"
        MissionDesignId=\"215\" PercentWeight=\"50\" StartDescription=\"[12387]Prof.
        Brenda: This next ship has AI focusing on more aggressive tactics. Now, these
        are real weapons, so try not to die horribly!|[userprofile]You: ...Wait, what!?\"
        EndDescription=\"[12387]Prof. Brenda: Remember that it's inefficient to have
        all your crew focus on weapons only. A balanced ship has several roles for
        the crew, and a different AI setup for each!\" TimeLimit=\"180\" MissionEventType=\"Battle\"
        EventXmlString=\"\" Title=\"\" IsSinglePlay=\"true\" RewardString=\"item:753x1\"
        RequirementString=\"\" CostString=\"\" FunctionString=\"marker(starSystemId=5,markerType=MissionObjective,markerFlags=6,missionDesignId=216,spriteId=12838)\"
        RequirementDescription=\"\" Flags=\"0\" ParentMissionEventId=\"0\" BackgroundId=\"0\"
        ShipId=\"98\" BackgroundSpriteId=\"0\" /><MissionEvent MissionEventId=\"1235\"
        MissionDesignId=\"216\" PercentWeight=\"50\" StartDescription=\"[12387]Prof.
        Brenda: This last ship has been programmed to run boarder tactics; teleporting
        your crew to wreak havoc on the enemy ship.|[12387]Prof. Brenda: It's a risky
        strategy, but it can be highly rewarding with the right AI setup. See for
        yourself!\" EndDescription=\"[12387]Prof. Brenda: Now you see the benefits
        of a robust AI, here are some chips for you to play around with. Good luck,
        and don't be scared to experiment!\" TimeLimit=\"180\" MissionEventType=\"Battle\"
